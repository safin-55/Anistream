services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: anistream
      POSTGRES_USER: anistream
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - anistream-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anistream -d anistream"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  anistream-db: